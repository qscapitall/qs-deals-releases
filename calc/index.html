<body>
<style>
/* Layout: iOS app. Large title that collapses into a blurred nav bar, grouped inset lists, bottom tab bar for the six strategies.
   iPad/desktop: inputs left, live results right. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f7; --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --blue:#007aff; --green:#248a3d; --green-bg:rgba(52,199,89,.16); --orange:#c25e00; --orange-bg:rgba(255,149,0,.18); --red:#d70015; --red-bg:rgba(255,59,48,.14);
  --bar:rgba(249,249,249,.82); --hero1:#0a6cff; --hero2:#3c3df0; --shadow:0 10px 30px rgba(0,0,0,.08);
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',Roboto,system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --label:#ffffff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --blue:#0a84ff; --green:#30d158; --green-bg:rgba(48,209,88,.18); --orange:#ff9f0a; --orange-bg:rgba(255,159,10,.18); --red:#ff453a; --red-bg:rgba(255,69,58,.18);
  --bar:rgba(22,22,24,.78); --hero1:#0a5ad6; --hero2:#3634c9; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --label:#ffffff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --blue:#0a84ff; --green:#30d158; --green-bg:rgba(48,209,88,.18); --orange:#ff9f0a; --orange-bg:rgba(255,159,10,.18); --red:#ff453a; --red-bg:rgba(255,69,58,.18);
  --bar:rgba(22,22,24,.78); --hero1:#0a5ad6; --hero2:#3634c9; --shadow:none; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--label);font-family:var(--sans);font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-text-size-adjust:100%;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}

/* nav bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:transparent;border-bottom:.5px solid transparent;transition:background .25s,border-color .25s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav .mid{font-size:17px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .35s var(--ease);display:flex;align-items:center;gap:8px;white-space:nowrap}
.nav.solid .mid{opacity:1;transform:none}
.nav .mid .tag{font-size:13px;font-weight:600;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
.nav .right{justify-self:end;display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--blue);position:relative;overflow:hidden}
.icon-btn svg{width:19px;height:19px}
.text-btn{border:0;background:none;color:var(--blue);font-size:17px;cursor:pointer;padding:8px 2px;position:relative;overflow:hidden;border-radius:10px}
.large{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 4px 14px}
.large h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
.large p{margin:4px 0 0;color:var(--label2);font-size:15px}

/* layout */
.app{max-width:1100px;margin:0 auto}
.cols{display:flex;flex-direction:column;gap:0}
.colL,.colR{min-width:0;display:flex;flex-direction:column}
@media (min-width:900px){
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .colR{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);order:2}
  .colL{order:1}
}
.mob-only{display:block} @media (min-width:900px){.mob-only{display:none}}
.desk-only{display:none} @media (min-width:900px){.desk-only{display:block}}

/* grouped inset lists */
.sec{margin:0 0 26px}
.sh{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px;display:flex;justify-content:space-between;align-items:baseline}
.sh b{font-weight:400}
.sf{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 16px;position:relative;cursor:default}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row .rl{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.row .rl small{font-size:12.5px;color:var(--label2);margin-top:1px}
.row .rv{display:flex;align-items:center;justify-content:flex-end;gap:2px;flex:0 1 52%;min-width:0;color:var(--label2);font-variant-numeric:tabular-nums}
label.row{cursor:text}
label.row:active{background:var(--fill)}
.row input{flex:0 1 auto;width:4ch;max-width:100%;min-width:1ch;border:0;background:transparent;text-align:right;color:var(--blue);font:inherit;font-variant-numeric:tabular-nums;outline:none;padding:6px 0;caret-color:var(--blue)}
.row input::placeholder{color:var(--label3)}
.row .u{color:var(--label2);font-size:15px;flex:0 0 auto}
.row.ro .rv{color:var(--label);font-weight:500;flex-basis:auto;white-space:nowrap}
.row.ro .rl{color:var(--label2)}
.row.tot .rl{color:var(--label);font-weight:600}
.row.tot .rv{font-weight:700}
.row .chg{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}

/* hero result card */
.hero{border-radius:22px;padding:18px 18px 16px;color:#fff;background:linear-gradient(145deg,var(--hero1),var(--hero2));position:relative;overflow:hidden;margin-bottom:26px;isolation:isolate;
  box-shadow:0 14px 34px rgba(10,80,220,.28)}
.hero .bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none;z-index:-1;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-10px,-14px) scale(1.06)}}
.hero .ht{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero small{font-size:13px;opacity:.85;font-weight:500}
.hero .val{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .verdict{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.2);white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .verdict .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.hero .st{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 11px;min-width:0}
.hero .st small{display:block;font-size:11.5px;opacity:.8}
.hero .st b{display:block;font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dot.g{background:#5cf08a}.dot.a{background:#ffc14d}.dot.r{background:#ff7b72}.dot.n{background:rgba(255,255,255,.6)}

/* fee */
.feebox{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.feein{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:14px;padding:0 16px;height:60px;transition:box-shadow .25s}
.feein:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 35%,transparent)}
.feein span{font-size:28px;color:var(--label2);font-weight:600}
.feein input{flex:1;min-width:0;border:0;background:transparent;font:700 32px var(--sans);color:var(--label);outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.feein input::placeholder{color:var(--label3)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--fill);color:var(--label);font-size:15px;font-weight:600;padding:9px 15px;border-radius:999px;cursor:pointer;position:relative;overflow:hidden;font-variant-numeric:tabular-nums;transition:background .25s,color .25s,transform .4s var(--spring)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.feestats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fs{background:var(--card2);border-radius:14px;padding:11px 13px}
.fs small{display:block;font-size:12.5px;color:var(--label2)}
.fs b{display:block;font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;transition:color .3s}
.fnote{font-size:14px;color:var(--label2);line-height:1.45}
.fnote b{color:var(--label)}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;position:relative;margin:2px 16px 10px}
.seg button{flex:1;border:0;background:transparent;font-size:14px;font-weight:600;padding:7px;border-radius:7px;cursor:pointer;position:relative;z-index:1;color:var(--label)}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:left .35s var(--spring),width .35s var(--spring)}
:root[data-theme="dark"] .seg .thumb{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg .thumb{background:#636366}}

/* rules */
.ck{display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 16px;position:relative}
.ck+.ck::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.ck i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.ck i svg{width:14px;height:14px}
.ck.ok i{background:var(--green-bg);color:var(--green)} .ck.no i{background:var(--red-bg);color:var(--red)}
.g{color:var(--green)!important} .a{color:var(--orange)!important} .r{color:var(--red)!important} .bl{color:var(--blue)!important}
.tg-g{background:var(--green-bg);color:var(--green)} .tg-a{background:var(--orange-bg);color:var(--orange)} .tg-r{background:var(--red-bg);color:var(--red)} .tg-n{background:var(--fill);color:var(--label2)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:640px;position:relative}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;cursor:pointer;color:var(--label2);position:relative;overflow:hidden;border-radius:12px;font-size:10.5px;font-weight:500;letter-spacing:0;transition:color .25s}
.tab svg{width:25px;height:25px;transition:transform .45s var(--spring)}
.tab[aria-selected="true"]{color:var(--blue)}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.12)}
@media (min-width:900px){.tabbar{left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:640px;border:.5px solid var(--sep);border-radius:22px;padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.14)}}

/* bubble press effect */
.bubble{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:bubble .6s var(--ease) forwards}
@keyframes bubble{to{transform:scale(1);opacity:0}}
.press{transition:transform .35s var(--spring)}
.press:active{transform:scale(.94)}

/* strategy switch */
.swap{animation:swapIn .45s var(--ease) both}
@keyframes swapIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* action sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  transform:translateY(110%);transition:transform .45s var(--spring);max-width:520px;margin:0 auto}
.sheet.on{transform:none}
.sheet .sg{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:14px;overflow:hidden;margin-top:8px}
.sheet .msg{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep)}
.sheet button{display:block;width:100%;border:0;background:transparent;font-size:20px;padding:17px;cursor:pointer;color:var(--blue);position:relative;overflow:hidden}
.sheet button+button{border-top:.5px solid var(--sep)}
.sheet .destr{color:var(--red)}
.sheet .cancel{font-weight:600;background:var(--card)}

.ex{display:inline-block;font-size:12px;font-weight:600;color:var(--orange);background:var(--orange-bg);padding:3px 9px;border-radius:999px;margin-top:8px}
.foot{text-align:center;font-size:12px;color:var(--label3);padding:6px 0 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="nav" id="nav">
    <div><button class="text-btn" id="resetBtn" type="button">Reset</button></div>
    <div class="mid"><span id="navTitle">Cash · DSCR</span><span class="tag tg-n" id="navTag">—</span></div>
    <div class="right"><button class="icon-btn press" id="themeBtn" type="button" aria-label="Appearance"></button></div>
  </div>
  <div class="large" id="large">
    <div><h1>Deal Calculator</h1><p id="largeSub">Cash · DSCR</p><span class="ex" id="exTag" hidden>Example numbers. Tap Reset to start yours.</span></div>

    <div class="colR" id="colR">

      <div class="desk-only" id="deskResults"></div>

        <div class="sh">Your assignment fee</div>
        <div class="group feebox">
          <div class="feein"><span>$</span><input id="p.fee" data-k="p.fee" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="10,000" aria-label="Assignment fee"></div>

          <div class="feestats">
            <div class="fs"><small>Max fee you can ask</small><b id="maxFee">—</b></div>

        <div class="sh" id="setHead">Deal settings</div>

</div>

<nav class="tabbar" aria-label="Strategy"><div class="tabs" role="tablist" id="tabs"></div></nav>

<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const usd = (v, d = 0) => (v < 0 ? '−$' : '$') + Math.abs(+v || 0).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const short = v => { const a = Math.abs(v), s = v < 0 ? '−$' : '$'; return a >= 1e6 ? s + (a / 1e6).toFixed(2) + 'M' : a >= 1e4 ? s + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'k' : s + Math.round(a).toLocaleString('en-US'); };
const pct = (v, d = 1) => isFinite(v) ? (v * 100).toFixed(d) + '%' : (v > 0 ? '∞' : '—');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- math (same as the QS Deals app) ---------- */
const RENT_KEEP = .8, LTV = .8, YEARS = 30, FLAT = 8000, CREATIVE_CLOSE = .04;
const pmt = (loan, r, n) => r === 0 ? loan / n : loan * r / (1 - Math.pow(1 + r, -n));
const balAt = (c, pay, i, m) => i === 0 ? Math.max(0, c - pay * m) : Math.max(0, c * Math.pow(1 + i, m) - pay * (Math.pow(1 + i, m) - 1) / i);
const EXAMPLE = {p:{asking:85000, arv:125000, repairs:8000, rent:1350, tax:120, ins:80, hoa:0, fee:10000}, st:{bal:62000, piti:640}};
const BLANK = () => ({
  tab:'cash', example:false, theme:'auto',
  p:{asking:null, arv:null, repairs:null, rent:null, tax:null, ins:null, hoa:null, fee:null},
  cash:{offer:null, disc:20, closePct:1.25, rate:7.5},
  flip:{rule:70, closePct:1.25, offer:null},
  sf:{price:null, downPct:10, pay:null, rate:0, balloon:7, appr:3, req:25},
  st:{bal:null, piti:null, price:null, down:null, rate:null},
  hy:{price:null, downPct:10, pay:null, rate:0, balloon:7},
  br:{fin:'cash', price:null, rehab:null, close:2, hold:4, hmPct:90, hmRate:12, hmPts:2, ltv:75, rate:7.5, term:30, refiPct:3, vac:8, mgmt:10, maint:5, capex:5}
});
const merge = (a, b) => { for (const k in b) a[k] = b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) ? merge(a[k] || {}, b[k]) : b[k]; return a; };
let S;
try { const raw = localStorage.getItem('qs-calc-v1'); S = raw ? merge(BLANK(), JSON.parse(raw)) : null; } catch (e) { S = null; }
if (!S) { S = merge(BLANK(), JSON.parse(JSON.stringify(EXAMPLE))); S.example = true; }
const save = () => { try { localStorage.setItem('qs-calc-v1', JSON.stringify(S)); } catch (e) {} };
const get = k => k.split('.').reduce((o, x) => o == null ? null : o[x], S);

    M.groups.push({t:'Monthly after refi', rows:[['Rent', usd(r.rent)], [`Vacancy · ${S.br.vac}%`, '−' + usd(r.rent - r.egi)], ['Expenses', '−' + usd(r.opex)], [`Loan P&I · ${S.br.rate}%`, '−' + usd(r.pi)], ['Cash flow', usd(r.cf), 'tot', r.cf >= 0 ? 'g' : 'r']]});
  } else {
    const c = r.ready ? tone(r.coc, .12, .08) : 'n';
    Object.assign(M, {label:'Buyer cash-on-cash', num:r.ready ? r.coc * 100 : null, fmt:v => v.toFixed(1) + '%', tone:c, nav:r.ready ? pct(r.coc) : '—',
      verdict:!r.ready ? (t === 'sf' ? 'Needs price + rent' : 'Needs loan + PITI') : r.coc >= .15 ? 'Great' : r.coc >= .12 ? 'Good' : r.coc >= .08 ? 'Tight' : 'Too thin',
      stats:[['Price to seller', short(r.P)], ['Cash flow /mo', short(r.cfm)], t === 'sf' ? ['Cash in', short(r.entry)] : ['Seller equity', pct(r.eqPct, 0)]]});
    M.groups.push({t:'Monthly', rows:[['Rent', usd(d.rent)], ['Vacancy + management · 20%', '−' + usd(d.rent * .2)],
      ...(t === 'sf' ? [['Payment to seller', '−' + usd(r.pay)], ['Taxes + insurance + HOA', '−' + usd(d.tax + d.ins + d.hoa)]] : [['PITI you take over', '−' + usd(r.piti)], ...(t === 'hy' ? [['Payment on equity', '−' + usd(r.pay)]] : []), ['HOA', '−' + usd(d.hoa)]]),
      ['Cash flow', usd(r.cfm), 'tot', r.cfm >= 0 ? 'g' : 'r']]});
    M.groups.push({t:'Cash to enter', rows:[[t === 'st' ? 'Cash to seller' : 'Down payment', usd(r.down)], ['Closing · 4%', usd(r.cc)], ['Your assignment fee', usd(d.fee)], ...(d.repairs ? [['Repairs', usd(d.repairs)]] : []), ['Cash to enter', usd(r.entry), 'tot']]});
    if (t === 'sf') M.groups.push({t:'Refinance at balloon', rows:[['Owed to seller then', usd(r.bal)], [`Value in ${r.years} years`, usd(r.val)], ['Equity at balloon', pct(r.eqPct, 0), 'tot', r.eqPct >= r.req ? 'g' : 'r']]});
    if (t === 'st') M.groups.push({t:'Why the seller says yes', rows:[['Sells with an agent (−7%, − loan)', usd(r.netList)], ['Sells to you (−3%, − loan)', usd(r.netUs)], ['Difference', usd(r.netUs - r.netList), 'tot', r.netUs >= r.netList ? 'g' : 'r']]});
    if (t === 'hy') M.groups.push({t:'Seller financing', rows:[['Financed by seller', usd(r.carry)], [`Owed at ${r.years}-year balloon`, usd(r.bbal), 'tot']]});
    M.checks = r.checks;
  }
  M.r = r; return M;
}
function resultsHtml(M) {
  const seen = {};
  const g = M.groups.map(G => `<section class="sec"><div class="sh">${esc(G.t)}</div><div class="group">${G.rows.map(([k, v, cls = '', tn = '']) => {
    const key = G.t + '|' + k, chg = prevRows[key] !== undefined && prevRows[key] !== v; seen[key] = v;
    return `<div class="row ro ${cls}"><span class="rl">${esc(k)}</span><span class="rv ${tn}"><span${chg ? ' class="chg" style="display:inline-block"' : ''}>${v}</span></span></div>`; }).join('')}</div>${G.foot ? `<div class="sf">${esc(G.foot)}</div>` : ''}</section>`).join('');
  const c = M.checks ? `<section class="sec"><div class="sh">Rules · ${M.checks.filter(x => x[1]).length} of ${M.checks.length} pass</div><div class="group">${M.checks.map(([t, ok]) => `<div class="ck ${ok ? 'ok' : 'no'}"><i>${ok ? ICON.ok : ICON.no}</i><span>${esc(t)}</span></div>`).join('')}</div></section>` : '';
  prevRows = seen; return g + c;
}
let heroBuilt = false;
function render() {
  const t = S.tab, M = model(), r = M.r, d = D();
  $$('[data-h]').forEach(h => { const f = HINTS[h.dataset.h]; h.textContent = f ? f() : ''; });
  const auto = {'cash.offer': r.auto, 'flip.offer': r.auto, 'sf.price': d.L * 1.1, 'sf.pay': d.rent * .4, 'st.price': d.L, 'st.down': r.equity, 'hy.price': d.L * 1.1, 'hy.pay': r.autoPay, 'br.price': d.L, 'br.rehab': d.repairs};
  $$('input[data-k]').forEach(i => { const a = auto[i.dataset.k]; i.placeholder = a ? Math.round(a).toLocaleString('en-US') : (i.dataset.k === 'p.fee' ? '10,000' : '0'); fit(i); });
  $$('[data-fee]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.fee === S.p.fee));
  $('#exTag').hidden = !S.example;

  /* hero */
  const hero = $('#hero');
  if (!heroBuilt) { hero.innerHTML = `<span class="bub" style="width:180px;height:180px;right:-50px;top:-60px"></span><span class="bub" style="width:90px;height:90px;right:70px;bottom:-40px;animation-delay:-3s"></span><span class="bub" style="width:46px;height:46px;left:46%;top:18px;animation-delay:-6s"></span>
    <div class="ht"><small id="hLabel"></small><span class="verdict" id="hVerdict"></span></div><div class="val" id="hVal">—</div><div class="stats" id="hStats"></div>`; heroBuilt = true; }
  $('#hLabel').textContent = M.label;
  $('#hVerdict').innerHTML = `<span class="dot ${M.tone}"></span>${esc(M.verdict)}`;
  const hv = $('#hVal'); if (M.num == null) { hv.textContent = '—'; hv.dataset.v = 'x'; } else { if (hv.dataset.fmt !== t) { hv.dataset.v = 'x'; hv.dataset.fmt = t; } tween(hv, M.num, M.fmt); }
  $('#hStats').innerHTML = M.stats.map(([k, v]) => `<div class="st"><small>${esc(k)}</small><b>${v}</b></div>`).join('');
  const tag = $('#navTag'); tag.textContent = M.nav; tag.className = 'tag tg-' + M.tone;

  /* fee */
  const mf = r.maxFee, fee = d.fee, ok = mf != null && mf >= 0;
  const tb = t === 'cash' || t === 'flip' ? r.toBuyer : t === 'br' ? r.buyPrice : (r.P || 0) + fee;
  $('#toBuyer').textContent = tb ? usd(tb) : '—';
  const mx = $('#maxFee'); mx.textContent = mf == null ? '—' : ok ? usd(Math.floor(mf / 100) * 100) : 'None'; mx.className = mf == null ? '' : !ok || fee > mf ? 'r' : 'g';
  const goal = {cash:'20% cash-on-cash for the buyer', flip:`the ${Math.round(S.flip.rule)}% rule`, sf:'12% cash-on-cash for the buyer', st:'12% cash-on-cash for the buyer', hy:'12% cash-on-cash for the buyer', br:'the buyer getting all their cash back at refinance'}[t];
  $('#feeNote').innerHTML = (t === 'cash' && S.cash.offer == null ? 'Your fee comes out of the seller’s offer. ' : '') + (mf == null ? 'Fill in the house to see how big a fee this deal can carry.'
    : !ok ? `At this price the deal misses ${goal} even with no fee. Lower your offer to the seller.`
    : fee <= mf ? `Your <b>${usd(fee)}</b> fee fits. You could ask up to <b>${usd(Math.floor(mf / 100) * 100)}</b> and still keep ${goal}.`
    : `Your <b>${usd(fee)}</b> fee is <b>${usd(fee - mf)}</b> too much for ${goal}.`);

  const html = resultsHtml(M), wide = matchMedia('(min-width:900px)').matches;
  $('#deskResults').innerHTML = wide ? html : ''; $('#mobResults').innerHTML = wide ? '' : html;
}

/* ---------- typing: live commas, caret kept ---------- */
function liveFmt(el) {
  const v = el.value, pos = el.selectionStart ?? v.length, keep = v.slice(0, pos).replace(/[^0-9.]/g, '').length;
  let c = v.replace(/[^0-9.]/g, ''); const dot = c.indexOf('.'); if (dot >= 0) c = c.slice(0, dot + 1) + c.slice(dot + 1).replace(/\./g, '');
  let [i, dec] = c.split('.'); i = i.replace(/^0+(?=\d)/, '');
  const out = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (dec !== undefined ? '.' + dec.slice(0, 2) : '');
  if (out === v) return; el.value = out;
  let n = 0, p = 0; while (p < out.length && n < keep) { if (/[0-9.]/.test(out[p])) n++; p++; }
  try { el.setSelectionRange(p, p); } catch (er) {}
}
document.addEventListener('keydown', e => {
  const el = e.target; if (!el.dataset || !el.dataset.k) return;
  if (e.key === 'Enter') { e.preventDefault(); const all = $$('input[data-k]'), i = all.indexOf(el); (all[i + 1] || el).focus(); if (!all[i + 1]) el.blur(); return; }
  if (el.selectionStart !== el.selectionEnd) return; const p = el.selectionStart;
  if (e.key === 'Backspace' && el.value[p - 1] === ',') el.setSelectionRange(p - 1, p - 1);
  if (e.key === 'Delete' && el.value[p] === ',') el.setSelectionRange(p + 1, p + 1);
});
const REQ = /^(cash\.(disc|closePct|rate)|flip\.(rule|closePct)|sf\.(downPct|rate|balloon|appr|req)|hy\.(downPct|rate|balloon)|br\.(?!price|rehab).+)$/;
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  liveFmt(e.target); fit(e.target); let v = parse(e.target.value); if (v != null && v < 0) v = 0;
  const [a, b] = k.split('.'); set(k, v == null && REQ.test(k) ? BLANK()[a][b] : v);
  S.example = false; save(); render();
});
document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.k) { e.target.value = fmtIn(get(e.target.dataset.k)); fit(e.target); } });
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.k) setTimeout(() => { try { e.target.select(); } catch (er) {} }, 0); });

/* ---------- bubble press ---------- */
document.addEventListener('pointerdown', e => {
  if (RM) return; const b = e.target.closest('.tab,.chip,.icon-btn,.text-btn,.sheet button,.seg button'); if (!b) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, x = document.createElement('span');
  x.className = 'bubble'; x.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  if (getComputedStyle(b).position === 'static') b.style.position = 'relative'; b.style.overflow = 'hidden'; b.appendChild(x); setTimeout(() => x.remove(), 650);
});

/* ---------- navigation ---------- */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b || b.dataset.tab === S.tab) return; S.tab = b.dataset.tab; prevRows = {}; save(); buildStrat(true); });
$('#feeChips').addEventListener('click', e => { const b = e.target.closest('[data-fee]'); if (!b) return; S.p.fee = +b.dataset.fee; S.example = false; save(); fillInputs(); render();
  if (!RM) b.animate([{transform:'scale(1)'}, {transform:'scale(1.14)'}, {transform:'scale(1)'}], {duration:420, easing:'cubic-bezier(.34,1.56,.64,1)'}); });
const nav = $('#nav'); new IntersectionObserver(([en]) => nav.classList.toggle('solid', !en.isIntersecting), {rootMargin:'-60px 0px 0px 0px'}).observe($('#large h1'));

/* appearance: auto → light → dark */
function applyTheme() { const r = document.documentElement; if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  const b = $('#themeBtn'); b.innerHTML = ICON[S.theme === 'auto' ? 'auto' : S.theme === 'light' ? 'sun' : 'moon']; b.setAttribute('aria-label', 'Appearance: ' + S.theme);
  const m = document.querySelector('meta[name="theme-color"]:not([media])'); if (m) m.content = getComputedStyle(r).getPropertyValue('--bg').trim(); }
$('#themeBtn').addEventListener('click', () => { S.theme = {auto:'light', light:'dark', dark:'auto'}[S.theme] || 'auto'; save(); applyTheme(); });

/* reset action sheet */
const bg = $('#sheetBg'), sh = $('#sheet');
const openSheet = () => { bg.hidden = sh.hidden = false; requestAnimationFrame(() => { bg.classList.add('on'); sh.classList.add('on'); }); $('#noReset').focus(); };
const closeSheet = () => { bg.classList.remove('on'); sh.classList.remove('on'); setTimeout(() => { bg.hidden = sh.hidden = true; }, 380); };
$('#resetBtn').onclick = openSheet; bg.onclick = closeSheet; $('#noReset').onclick = closeSheet;
$('#doReset').onclick = () => { const tab = S.tab, theme = S.theme; S = BLANK(); S.tab = tab; S.theme = theme; prevRows = {}; save(); closeSheet(); buildStrat(true); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sh.hidden) closeSheet(); });

let wasWide = matchMedia('(min-width:900px)').matches;
addEventListener('resize', () => { const w = matchMedia('(min-width:900px)').matches; if (w !== wasWide) { wasWide = w; render(); } segThumb(); });
applyTheme(); buildStrat(false);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
